name: Android signing key (run once)

# Creates the key the Android app is signed with. Download the artifact with `gh run download`, store it as the
# repository secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD, then delete the artifact and this run.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Create the key
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore release.jks -alias eurojackpot -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=EuroJackpot Analyzer, O=VeZReVouLiS, C=GR"
          echo "$PASS" > password.txt
          base64 -w0 release.jks > release.jks.b64
      - uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: |
            release.jks.b64
            password.txt
          retention-days: 1
